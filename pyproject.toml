[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dineof_hpc"
version = "0.1.0"
description = "High-performance DINEOF implementation for large oceanographic datasets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [
    {name = "Julien Masson"}
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "netCDF4",
    "numba",
    "joblib",
    "scikit-learn",
    "matplotlib",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]